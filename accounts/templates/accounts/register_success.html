<!DOCTYPE html>
<html lang="ru">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ Регистрация успешна!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/weather.css' %}">
    <link rel="stylesheet" href="{% static 'css/cursor.css' %}">
</head>
<body class="d-flex align-items-center min-vh-100 py-3">

    <!-- Weather -->
    <div class="weather-container" id="weatherContainer"></div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <!-- 🎉 УСПЕШНОЕ ОКОШКО -->
                <div class="text-center p-5" style="backdrop-filter: blur(30px); background: rgba(255,255,255,0.2); border-radius: 25px; border: 1px solid rgba(255,255,255,0.3);">

                    <div class="mb-5">
                        <div class="display-1 mb-4 text-warning">🎉</div>
                        <h1 class="display-4 fw-bold text-white mb-3">Регистрация успешна!</h1>
                        <p class="lead text-white-50 mb-4">Аккаунт <strong>{{ username }}</strong> создан!</p>
                        <div class="bg-dark bg-opacity-25 p-3 rounded-4 mb-4">
                            <h5 class="text-info mb-2">📋 Данные аккаунта:</h5>
                            <p><strong>Логин:</strong> {{ username }}</p>
                            <p><strong>ID:</strong> <code>{{ personal_id }}</code></p>
                        </div>
                    </div>

                    <!-- КНОПКИ -->
                    <div class="d-grid gap-3 col-8 mx-auto">
                        <a href="/login/" class="btn btn-warning btn-lg rounded-4 py-4 fs-5 fw-bold shadow-lg">
                            🚀 Войти в аккаунт
                        </a>
                        <a href="/" class="btn btn-outline-light btn-lg rounded-4 py-4 fs-5 fw-bold">
                            ← На главную
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/weather.js' %}"></script>
    <script src="{% static 'js/cursor.js' %}"></script>
</body>
</html>
